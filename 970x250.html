<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Apuração 2026 - 970x250</title>
    <link rel="stylesheet" href="/css/970x250.css">
    <link rel="stylesheet" href="/css/widget.css">
</head>
<body data-widget="970x250">
    <div class="widget-horizontal widget-970x250">
        <div class="bloco-header">
            <div class="header-brand">
                <div class="header-copy">
                    <span class="header-kicker">Resultados TSE</span>
                    <h2>Apuração 2026</h2>
                </div>
                <a class="produto-link" href="https://paineleleitoral2026.vercel.app/?utm_source=widget&amp;utm_medium=referral&amp;utm_campaign=apuracao_2026" target="_blank" rel="noopener noreferrer" aria-label="Tenha este widget no seu site">
                    <span class="produto-link-amplo">Tenha este widget</span>
                    <span class="produto-link-curto">Obter widget</span>
                    <span aria-hidden="true">↗</span>
                </a>
            </div>

            <div class="controles" role="group" aria-label="Filtros da apuração">
                <select id="select-turno" class="sel-turno" aria-label="Turno">
                    <option value="1">1º Turno</option>
                    <option value="2">2º Turno</option>
                </select>
                <select id="select-cargo" class="sel-cargo" aria-label="Cargo">
                    <option value="1">Presidente</option>
                    <option value="3">Governador</option>
                    <option value="5">Senador</option>
                    <option value="6">Dep. Federal</option>
                    <option value="7">Dep. Estadual</option>
                </select>
                <select id="select-uf" class="sel-uf" aria-label="Unidade federativa">
                    <option value="br">BR</option>
                    <option value="ac">AC</option>
                    <option value="al">AL</option>
                    <option value="ap">AP</option>
                    <option value="am">AM</option>
                    <option value="ba">BA</option>
                    <option value="ce">CE</option>
                    <option value="df">DF</option>
                    <option value="es">ES</option>
                    <option value="go">GO</option>
                    <option value="ma">MA</option>
                    <option value="mt">MT</option>
                    <option value="ms">MS</option>
                    <option value="mg">MG</option>
                    <option value="pa">PA</option>
                    <option value="pb">PB</option>
                    <option value="pr">PR</option>
                    <option value="pe">PE</option>
                    <option value="pi">PI</option>
                    <option value="rj">RJ</option>
                    <option value="rn">RN</option>
                    <option value="rs">RS</option>
                    <option value="ro">RO</option>
                    <option value="rr">RR</option>
                    <option value="sc">SC</option>
                    <option value="sp">SP</option>
                    <option value="se">SE</option>
                    <option value="to">TO</option>
                </select>
            </div>
        </div>

        <div class="bloco-status">
            <div class="status-topo">
                <span class="status-label"><span class="status-dot" aria-hidden="true"></span>Urnas apuradas</span>
                <span id="txt-percurso">0,00%</span>
            </div>
            <div class="barra-total-bg" role="progressbar" aria-label="Percentual de urnas apuradas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div id="barra-percurso" class="barra-total-fill"></div>
            </div>
            <span id="ultima-atualizacao" class="data-hora" aria-live="polite">Conectando...</span>
        </div>

        <div id="lista-candidatos" class="bloco-carrossel" aria-live="polite" aria-busy="true">
            <span class="loading-msg"><span class="loading-spinner" aria-hidden="true"></span>Buscando dados no TSE...</span>
        </div>
    </div>

    <script src="seguranca.js"></script>
    <script src="/js/widget.js"></script>
    <script src="/js/970x250.js"></script>
</body>
</html>
