<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Apuração 2026 - 300x600</title>
    <link rel="stylesheet" href="/css/300x600.css">
    <link rel="stylesheet" href="/css/widget.css">
</head>
<body data-widget="300x600">

<div class="widget-container">
    <div class="widget-header">
        <div class="header-brand">
            <div class="header-copy">
                <span class="header-kicker">Resultados eleitorais</span>
                <h2>Apuração das Eleições de 2026</h2>
            </div>
            <a class="produto-link" href="https://paineleleitoral2026.vercel.app/?utm_source=widget&amp;utm_medium=referral&amp;utm_campaign=apuracao_2026" target="_blank" rel="noopener noreferrer" aria-label="Tenha este widget no seu site">
                <span class="produto-link-amplo">Tenha este widget</span>
                <span class="produto-link-curto">Obter widget</span>
                <span aria-hidden="true">↗</span>
            </a>
        </div>
        <div class="controles" role="group" aria-label="Filtros da apuração">
            <select id="select-turno" aria-label="Turno">
                <option value="1">1º Turno</option>
                <option value="2">2º Turno</option>
            </select>
            <select id="select-cargo" aria-label="Cargo">
                <option value="1">Presidente</option>
                <option value="3">Governador</option>
                <option value="5">Senador</option>
                <option value="6">Deputado Federal</option>
                <option value="7">Deputado Estadual</option>
            </select>
            <select id="select-uf" aria-label="Unidade federativa">
                <option value="br">Brasil (Total)</option>
                <option value="ac">Acre</option>
                <option value="al">Alagoas</option>
                <option value="ap">Amapá</option>
                <option value="am">Amazonas</option>
                <option value="ba">Bahia</option>
                <option value="ce">Ceará</option>
                <option value="df">Distrito Federal</option>
                <option value="es">Espírito Santo</option>
                <option value="go">Goiás</option>
                <option value="ma">Maranhão</option>
                <option value="mt">Mato Grosso</option>
                <option value="ms">Mato Grosso do Sul</option>
                <option value="mg">Minas Gerais</option>
                <option value="pa">Pará</option>
                <option value="pb">Paraíba</option>
                <option value="pr">Paraná</option>
                <option value="pe">Pernambuco</option>
                <option value="pi">Piauí</option>
                <option value="rj">Rio de Janeiro</option>
                <option value="rn">Rio Grande do Norte</option>
                <option value="rs">Rio Grande do Sul</option>
                <option value="ro">Rondônia</option>
                <option value="rr">Roraima</option>
                <option value="sc">Santa Catarina</option>
                <option value="sp">São Paulo</option>
                <option value="se">Sergipe</option>
                <option value="to">Tocantins</option>
            </select>
        </div>
    </div>

    <div class="status-geral">
        <div class="info-topo">
            <span class="status-label"><span class="status-dot" aria-hidden="true"></span>Urnas apuradas</span>
            <span id="txt-percurso">0,00%</span>
        </div>
        <div class="barra-progresso-total" role="progressbar" aria-label="Percentual de urnas apuradas" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="barra-percurso" class="preenchimento-total"></div>
        </div>
        <span id="ultima-atualizacao" class="data-hora" aria-live="polite">Iniciando conexão...</span>
    </div>

    <button type="button" class="resumo-toggle" onclick="toggleResumo()" aria-expanded="false" aria-controls="bloco-resumo">
        <span id="txt-toggle">Ver resumo de votos</span>
    </button>

    <div id="bloco-resumo" class="resumo-votos oculto">
        <div class="resumo-item">
            <span>Válidos</span>
            <span class="resumo-valor" id="votos-validos">--</span>
        </div>
        <div class="resumo-item">
            <span>Brancos</span>
            <span class="resumo-valor" id="votos-brancos">--</span>
        </div>
        <div class="resumo-item">
            <span>Nulos</span>
            <span class="resumo-valor" id="votos-nulos">--</span>
        </div>
        <div class="resumo-item">
            <span>Abstenções</span>
            <span class="resumo-valor" id="votos-abstencoes">--</span>
        </div>
    </div>

    <div id="lista-candidatos" class="lista-candidatos" aria-live="polite" aria-busy="true">
        <div class="loading-overlay"><span class="loading-spinner" aria-hidden="true"></span>Buscando dados...</div>
    </div>
</div>
<script src="seguranca.js"></script>
<script src="/js/widget.js"></script>
<script src="/js/300x600.js"></script>
</body>
</html>
